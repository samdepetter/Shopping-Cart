<!DOCTYPE html>
<html lang="nl-BE">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f7f5f1" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#171614" media="(prefers-color-scheme: dark)">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Boodschappen">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<title>Boodschappen</title>
<style>
:root{
  --bg:#f7f5f1;--panel:#fff;--ink:#1f1d1a;--muted:#6b665e;--line:#e6e1d8;
  --accent:#c2410c;--accent-soft:#fdeee5;--ok:#2f7d4f;--ok-soft:#e7f3ec;--promo:#b91c1c;--promo-soft:#fde8e8;
  --r:12px;--font:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
@media (prefers-color-scheme:dark){
  :root{--bg:#171614;--panel:#211f1c;--ink:#f2efe9;--muted:#a39d93;--line:#34312c;--accent:#f97316;--accent-soft:#3a2416;--ok:#5fbf86;--ok-soft:#1d3226;--promo:#f87171;--promo-soft:#3b1d1d}
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 var(--font);-webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent}
.wrap{max-width:720px;margin:0 auto;padding:calc(10px + env(safe-area-inset-top)) calc(14px + env(safe-area-inset-right)) calc(96px + env(safe-area-inset-bottom)) calc(14px + env(safe-area-inset-left))}
header{display:flex;align-items:baseline;justify-content:space-between;gap:8px;padding:4px 2px 8px}
header h1{font-size:22px;margin:0;font-weight:700}
header .sub{color:var(--muted);font-size:12.5px;text-align:right}
section.view{display:none}section.view.on{display:block}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:4px 14px;margin-bottom:12px}
.card.pad{padding:14px}
.muted{color:var(--muted)}.small{font-size:13px}
h2.grp{font-size:12.5px;margin:16px 4px 6px;color:var(--muted);font-weight:650;text-transform:uppercase;letter-spacing:.04em}
.row{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line);min-height:56px}
.row:first-child{border-top:0}
.row .main{flex:1;min-width:0}
.row .name{font-weight:560;overflow-wrap:anywhere}
.row .meta{font-size:13px;color:var(--muted)}
.num{font-variant-numeric:tabular-nums;white-space:nowrap}
.check{width:30px;height:30px;flex:none;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;color:transparent;font-weight:800;font-size:16px}
.row.done .check{background:var(--ok);border-color:var(--ok);color:#fff}
.row.done .name{text-decoration:line-through;color:var(--muted)}
.row.done .bottom{display:none}
.row.line{flex-direction:column;align-items:stretch;gap:8px}
.line .top{display:flex;align-items:center;gap:10px}
.line .bottom{display:flex;align-items:center;gap:10px;padding-left:42px}
.line .bottom .hint{flex:1;margin:0}
.tap{display:flex;align-items:center;gap:12px;flex:1;min-width:0;cursor:pointer;user-select:none}
.stepper{display:flex;align-items:center;gap:2px;flex:none}
.stepper button,.add{width:36px;height:36px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font:600 19px var(--font);cursor:pointer;display:grid;place-items:center;padding:0}
.add{background:var(--accent);border-color:var(--accent);color:#fff;flex:none}
.add.in{background:var(--ok);border-color:var(--ok);font-size:14px;width:auto;padding:0 10px}
.stepper .v{min-width:30px;text-align:center;font-variant-numeric:tabular-nums;font-weight:650}
.price{font-weight:650;min-width:62px;text-align:right}
.price s{display:block;font-weight:400;font-size:12px;color:var(--muted)}
.hint{margin-top:5px;font-size:13px;background:var(--promo-soft);color:var(--promo);border-radius:8px;padding:5px 8px;display:flex;gap:8px;align-items:center;justify-content:space-between}
.hint button{font:inherit;font-weight:700;font-size:12.5px;border:0;border-radius:6px;background:var(--promo);color:#fff;padding:4px 9px;cursor:pointer;white-space:nowrap}
.hint.ok{background:var(--ok-soft);color:var(--ok)}
.tag{display:inline-block;font-size:11.5px;font-weight:700;padding:1px 7px;border-radius:999px;background:var(--promo-soft);color:var(--promo);margin-left:4px;vertical-align:1px}
.search{position:sticky;top:0;z-index:5;background:var(--bg);padding:2px 0 10px}
.search input{width:100%;font:inherit;font-size:17px;padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:var(--panel);color:var(--ink);outline:none}
.search input:focus{border-color:var(--accent)}
.sum{display:flex;justify-content:space-between;align-items:baseline;padding:12px 4px 4px;font-weight:700;font-size:18px}
.sum .muted{font-weight:500;font-size:14px}
.btns{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}
.btn{font:inherit;font-weight:600;font-size:14px;border-radius:10px;border:1px solid var(--line);background:var(--panel);color:var(--ink);padding:9px 14px;cursor:pointer}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.empty{text-align:center;padding:28px 10px;color:var(--muted)}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:8px}
.chips button{flex:none;font:inherit;font-size:13.5px;font-weight:600;border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:999px;padding:7px 12px;cursor:pointer}
.chips button.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.recipe summary{cursor:pointer;list-style:none;padding:12px 0;display:flex;justify-content:space-between;gap:10px;font-weight:600}
.recipe summary::-webkit-details-marker{display:none}
.recipe{border-top:1px solid var(--line)}.recipe:first-child{border-top:0}
.recipe ul,.recipe ol{margin:0 0 8px;padding-left:20px;font-size:14px}
nav.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--panel);border-top:1px solid var(--line);display:flex;justify-content:center;padding:6px 6px calc(6px + env(safe-area-inset-bottom))}
nav.tabbar .in{display:flex;max-width:720px;width:100%}
nav.tabbar button{flex:1;font:inherit;font-size:12px;font-weight:600;border:0;background:none;color:var(--muted);padding:4px 0;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px;position:relative}
nav.tabbar button .ic{font-size:21px;line-height:1}
nav.tabbar button.on{color:var(--accent)}
nav.tabbar .badge{position:absolute;top:0;left:calc(50% + 6px);min-width:18px;padding:0 5px;border-radius:9px;background:var(--accent);color:#fff;font-size:11px;line-height:18px}
.thumb{width:44px;height:44px;flex:none;border-radius:8px;object-fit:contain;background:#fff;border:1px solid var(--line)}
.chg{display:inline-block;font-size:11.5px;font-weight:700;padding:1px 7px;border-radius:999px;margin-left:4px;vertical-align:1px}
.chg.down{background:var(--ok-soft);color:var(--ok)}.chg.up{background:var(--promo-soft);color:var(--promo)}
.more{width:100%;margin:4px 0 12px}
.rhead{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.rimg{width:100%;aspect-ratio:16/9;object-fit:cover;border-radius:10px;margin:4px 0}
.credit{font-size:11px;color:var(--muted);margin:0 0 6px}
.ings{list-style:none;padding:0;margin:4px 0 10px}.ings li{display:flex;justify-content:space-between;gap:10px;padding:5px 0;border-top:1px solid var(--line);font-size:14.5px}.ings li:first-child{border-top:0}
.ings .amt{color:var(--muted);white-space:nowrap}
.steps{margin:0 0 6px;padding-left:22px}.steps li{margin:0 0 8px;font-size:14.5px}
.cook{position:fixed;inset:0;z-index:50;background:var(--bg);display:none;flex-direction:column;padding:calc(16px + env(safe-area-inset-top)) 20px calc(20px + env(safe-area-inset-bottom))}
.cook.on{display:flex}
.cook .top{display:flex;justify-content:space-between;align-items:center;gap:10px}
.cook .top b{font-size:16px}
.cook .x{font:600 22px var(--font);border:0;background:none;color:var(--ink);padding:6px 10px;cursor:pointer}
.cook .bar{height:5px;border-radius:3px;background:var(--line);margin:12px 0 0;overflow:hidden}.cook .bar i{display:block;height:100%;background:var(--accent)}
.cook .n{color:var(--muted);font-weight:650;margin-top:22px}
.cook .txt{font-size:25px;line-height:1.35;font-weight:560;flex:1;margin-top:8px;overflow:auto}
.cook .nav{display:flex;gap:10px}.cook .nav button{flex:1;font:inherit;font-size:17px;font-weight:700;padding:16px;border-radius:14px;border:1px solid var(--line);background:var(--panel);color:var(--ink);cursor:pointer}
.cook .nav button.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:10px;font-size:14px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:30;max-width:90vw}
.toast.on{opacity:1}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1 id="title">Boodschappenlijst</h1>
    <div class="sub" id="pricedAt"></div>
  </header>

  <!-- LIJST -->
  <section class="view on" id="v-lijst">
    <div id="listBody"></div>
  </section>

  <!-- ZOEKEN -->
  <section class="view" id="v-zoeken">
    <div class="search"><input id="q" type="search" placeholder="Zoek een product…" autocomplete="off" enterkeyhint="search"></div>
    <div id="cats" class="chips"></div>
    <div id="results"></div>
  </section>

  <!-- PROMOTIES -->
  <section class="view" id="v-promo">
    <div id="priceBody"></div>
    <div class="search"><input id="pq" type="search" placeholder="Zoek in promoties…" autocomplete="off" enterkeyhint="search"></div>
    <div id="promoBody"></div>
  </section>

  <!-- GERECHTEN -->
  <section class="view" id="v-gerechten">
    <div class="card" id="recipeBody"></div>
  </section>
</div>

<nav class="tabbar"><div class="in">
  <button data-v="lijst" class="on"><span class="ic">🛒</span>Lijst<span class="badge" id="badge" hidden></span></button>
  <button data-v="zoeken"><span class="ic">🔍</span>Zoeken</button>
  <button data-v="promo"><span class="ic">🏷️</span>Aanbod<span class="badge" id="badgeP" hidden></span></button>
  <button data-v="gerechten"><span class="ic">🍳</span>Gerechten</button>
</div></nav>
<div class="toast" id="toast"></div>
<div class="cook" id="cook" role="dialog" aria-modal="true">
  <div class="top"><b id="cookTitle"></b><button class="x" id="cookClose" aria-label="sluiten">✕</button></div>
  <div class="bar"><i id="cookBar"></i></div>
  <div class="n" id="cookN"></div>
  <div class="txt" id="cookTxt"></div>
  <div class="nav"><button id="cookPrev">← Vorige</button><button class="primary" id="cookNext">Volgende →</button></div>
</div>

<script>
(() => {
"use strict";
const $ = (s) => document.querySelector(s);
const eur = new Intl.NumberFormat("nl-BE", {style: "currency", currency: "EUR"});
const MON = ["jan", "feb", "mrt", "apr", "mei", "jun", "jul", "aug", "sep", "okt", "nov", "dec"];
const KEY = "boodschappen-v2";
const TITLES = {lijst: "Boodschappenlijst", zoeken: "Product zoeken", promo: "Promoties & prijzen", gerechten: "Gerechten"};

let CAT = {}, CATL = [], RECIPES = [], PROMOS = {}, PROMOL = [], META = {};
let ST = {list: [], counts: {}};
const UI = {view: "lijst", q: "", cat: "", pq: "", pmax: 40};
let CHG = {}, CHGL = [];

/* ---------- helpers ---------- */
function el(tag, attrs = {}, ...kids) {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (v == null || v === false) continue;
    if (k === "text") e.textContent = v;
    else if (k.startsWith("on")) e.addEventListener(k.slice(2), v);
    else e.setAttribute(k, v === true ? "" : v);
  }
  for (const k of kids.flat()) if (k != null && k !== false) e.append(k.nodeType ? k : document.createTextNode(k));
  return e;
}
const norm = (s) => String(s || "").normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase();
const fmtDay = (iso) => { const d = new Date(iso); return isNaN(d) ? "" : `${d.getDate()} ${MON[d.getMonth()]}`; };
const slug = (s) => "eigen-" + norm(s).replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "");
function toast(msg) { const t = $("#toast"); t.textContent = msg; t.classList.add("on"); clearTimeout(toast.h); toast.h = setTimeout(() => t.classList.remove("on"), 2200); }
function save() { try { localStorage.setItem(KEY, JSON.stringify(ST)); } catch { toast("Opslaan op dit toestel lukt niet."); } render(); }

/* ---------- promotions ----------
   promo types (data/promos.json):
     multi   {buy, pay}        e.g. 3 halen, 2 betalen
     nth     {n, pct}          e.g. 2de aan -50%  -> n:2, pct:50
     volume  {min, price}      stukprijs `price` vanaf `min` stuks
     percent {pct, min?}       -pct% (vanaf min stuks)
     price   {price}           tijdelijk lagere stukprijs            */
function promoFor(key) {
  const p = PROMOS[key];
  if (!p) return null;
  if (p.until && new Date(p.until + "T23:59:59") < new Date()) return null;
  return p;
}
function threshold(p) { return p.type === "multi" ? p.buy : p.type === "nth" ? p.n : (p.min || 1); }
const regular = (item, p) => item.price || (p && p.regular) || 0;
function costFor(item, q) {
  const p = promoFor(item.key), price = regular(item, p);
  if (!p || q <= 0) return q * price;
  switch (p.type) {
    case "multi": return (Math.floor(q / p.buy) * p.pay + (q % p.buy)) * price;
    case "nth": return q * price - Math.floor(q / p.n) * price * p.pct / 100;
    case "volume": return q >= p.min ? q * p.price : q * price;
    case "percent": return q >= (p.min || 1) ? q * price * (1 - p.pct / 100) : q * price;
    case "price": case "folder": return q * (p.price || price);
  }
  return q * price;
}
function dealText(p, item) {
  switch (p.type) {
    case "multi": return `${p.buy} halen, ${p.pay} betalen`;
    case "nth": return `${p.n}de aan -${p.pct}%`;
    case "volume": return `vanaf ${p.min} st. ${eur.format(p.price)}/st.`;
    case "percent": return `-${p.pct}%` + (p.min > 1 ? ` vanaf ${p.min} st.` : "");
    case "price": return `nu ${eur.format(p.price)}` + (regular(item, p) > p.price ? ` i.p.v. ${eur.format(regular(item, p))}` : "");
    case "folder": return `folderprijs ${eur.format(p.price)}`;
  }
  return p.label || "promo";
}
/* best per-unit price and the qty that unlocks it */
function bestDeal(item) {
  const p = promoFor(item.key);
  if (!p) return null;
  const t = threshold(p), unit = costFor(item, t) / t, reg = regular(item, p);
  return {p, qty: t, unit, save: reg ? reg - unit : 0, pct: reg ? Math.round((reg - unit) / reg * 100) : 0};
}
/* suggestion for a list line: buy `to` instead of `q` */
function suggestion(item, q) {
  const d = bestDeal(item);
  if (!d || d.save <= 0.004) return null;
  const t = d.qty;
  if (q > 0 && q % t === 0) return {ok: true, d, unit: costFor(item, q) / q};
  const to = Math.max(t, Math.ceil(q / t) * t);
  return {ok: false, d, to, unit: costFor(item, to) / to};
}
function chgBadge(key) {
  const c = CHG[key];
  if (!c) return null;
  const down = c.to < c.from;
  return el("span", {class: "chg " + (down ? "down" : "up"), title: `was ${eur.format(c.from)}`, text: (down ? "↓ " : "↑ ") + eur.format(Math.abs(c.to - c.from)) + (c.perKg ? "/kg" : "")});
}
const ppLink = () => el("a", {href: "https://www.prijsprofeet.be/", target: "_blank", rel: "noopener", text: "PrijsProfeet"});
const thumb = (it) => it.img ? el("img", {class: "thumb", src: it.img, alt: "", loading: "lazy"}) : null;

/* ---------- list ops ---------- */
const lineOf = (key) => ST.list.find((l) => l.key === key);
function addItem(key, n = 1, name) {
  let l = lineOf(key);
  if (l) { l.qty += n; l.done = false; }
  else { l = {key, qty: n, done: false}; if (!CAT[key]) l.name = name; ST.list.push(l); }
  ST.counts[key] = (ST.counts[key] || 0) + 1;
  save();
  const it = itemOf(l);
  const s = suggestion(it, l.qty);
  toast(s && !s.ok ? `${it.name}: promo! Neem ${s.to} voor ${eur.format(s.unit)}/st.` : `${it.name} op je lijst`);
}
function setQty(key, q) {
  const l = lineOf(key); if (!l) return;
  if (q <= 0) ST.list = ST.list.filter((x) => x !== l); else l.qty = q;
  save();
}
const itemOf = (l) => CAT[l.key] || {key: l.key, name: l.name || l.key, cat: "Eigen items", price: 0};

/* ---------- render ---------- */
function render() {
  const open = ST.list.filter((l) => !l.done).length;
  const bp = $("#badgeP"), nP = CHGL.filter((c) => c.to < c.from && (ST.counts[c.key] || lineOf(c.key))).length;
  bp.hidden = !nP; bp.textContent = nP;
  const b = $("#badge"); b.hidden = !open; b.textContent = open;
  if (UI.view === "lijst") renderList();
  if (UI.view === "zoeken") renderSearch();
  if (UI.view === "promo") renderPromos();
  if (UI.view === "gerechten") renderRecipes();
}

function stepper(l) {
  return el("div", {class: "stepper"},
    el("button", {"aria-label": "minder", onclick: (e) => { e.stopPropagation(); setQty(l.key, l.qty - 1); }, text: "−"}),
    el("span", {class: "v", text: l.qty}),
    el("button", {"aria-label": "meer", onclick: (e) => { e.stopPropagation(); setQty(l.key, l.qty + 1); }, text: "+"}));
}
function priceCell(it, q) {
  if (!it.price) return el("div", {class: "price num muted", text: ""});
  const full = it.price * q, real = costFor(it, q);
  return el("div", {class: "price num"}, eur.format(real), real < full - 0.004 ? el("s", {text: eur.format(full)}) : null);
}

function renderList() {
  const box = $("#listBody"); box.replaceChildren();
  if (!ST.list.length) {
    box.append(el("div", {class: "card pad empty"},
      el("p", {text: "Je lijst is leeg."}),
      el("button", {class: "btn primary", onclick: () => go("zoeken"), text: "🔍 Product zoeken"})));
    return;
  }
  const todo = ST.list.filter((l) => !l.done), done = ST.list.filter((l) => l.done);
  const groups = {};
  for (const l of todo) (groups[itemOf(l).cat || "Overige"] ||= []).push(l);
  for (const cat of Object.keys(groups).sort((a, b) => a.localeCompare(b))) {
    box.append(el("h2", {class: "grp", text: cat}));
    const card = el("div", {class: "card"});
    for (const l of groups[cat].sort((a, b) => itemOf(a).name.localeCompare(itemOf(b).name))) card.append(lineRow(l));
    box.append(card);
  }
  if (done.length) {
    box.append(el("h2", {class: "grp", text: `In je kar (${done.length})`}));
    const card = el("div", {class: "card"});
    for (const l of done) card.append(lineRow(l));
    box.append(card);
  }
  const total = ST.list.reduce((s, l) => s + costFor(itemOf(l), l.qty), 0);
  const left = todo.reduce((s, l) => s + costFor(itemOf(l), l.qty), 0);
  const saved = ST.list.reduce((s, l) => s + (itemOf(l).price || 0) * l.qty - costFor(itemOf(l), l.qty), 0);
  box.append(el("div", {class: "sum"}, el("span", {}, "Totaal ", el("span", {class: "muted", text: done.length ? `nog ${eur.format(left)}` : ""})), el("span", {class: "num", text: eur.format(total)})));
  if (saved > 0.004) box.append(el("p", {class: "small", style: "margin:0 4px;color:var(--promo)", text: `Je bespaart ${eur.format(saved)} met promoties.`}));
  box.append(el("div", {class: "btns"},
    done.length ? el("button", {class: "btn", onclick: () => { ST.list = todo; save(); }, text: "Afgevinkte wissen"}) : null,
    el("button", {class: "btn", onclick: () => { if (confirm("Hele lijst leegmaken?")) { ST.list = []; save(); } }, text: "Lijst leegmaken"})));
  box.append(el("p", {class: "small muted", style: "margin:4px", text: "Tik op een product als het in je winkelkar ligt."}));
  if (ST.list.some((l) => itemOf(l).src === "PrijsProfeet")) box.append(el("p", {class: "small muted", style: "margin:4px"}, "Colruyt-prijzen o.a. via ", ppLink(), "."));
}
function lineRow(l) {
  const it = itemOf(l), s = suggestion(it, l.qty);
  const hint = !s ? null : s.ok
    ? el("div", {class: "hint ok", text: `✓ ${dealText(s.d.p, it)}: ${eur.format(s.unit)}/st.`})
    : el("div", {class: "hint"}, el("span", {text: `${dealText(s.d.p, it)}: neem ${s.to} voor ${eur.format(s.unit)}/st.`}),
        el("button", {onclick: () => { setQty(l.key, s.to); toast(`${s.to}× ${it.name}`); }, text: `Neem ${s.to}`}));
  return el("div", {class: "row line" + (l.done ? " done" : "")},
    el("div", {class: "top"},
      el("div", {class: "tap", role: "button", "aria-pressed": l.done ? "true" : "false", onclick: () => { l.done = !l.done; save(); }},
        el("span", {class: "check", text: "✓"}),
        thumb(it),
        el("div", {class: "main"},
          el("div", {class: "name"}, it.name, promoFor(it.key) ? el("span", {class: "tag", text: "promo"}) : null, chgBadge(it.key)),
          it.price ? el("div", {class: "meta", text: it.kgPrice ? `${eur.format(it.kgPrice)}/kg · ±${eur.format(it.price)}` : `${eur.format(it.price)}/st.`}) : null)),
      priceCell(it, l.qty)),
    el("div", {class: "bottom"}, stepper(l), hint));
}

function resultRow(it) {
  const l = lineOf(it.key), d = bestDeal(it), good = d && d.save > 0.004;
  const price = it.kgPrice ? `${eur.format(it.kgPrice)}/kg` : it.price ? `${eur.format(it.price)}/st.` : (d ? eur.format(d.p.price || 0) : "");
  return el("div", {class: "row"},
    thumb(it),
    el("div", {class: "main"},
      el("div", {class: "name"}, it.name, good ? el("span", {class: "tag", text: dealText(d.p, it)}) : null, chgBadge(it.key)),
      el("div", {class: "meta"}, price, good ? ` · promo ${eur.format(d.unit)}/st. bij ${d.qty}` : "")),
    el("button", {class: "add" + (l ? " in" : ""), "aria-label": "toevoegen", onclick: () => addItem(it.key, 1, it.name), text: l ? `${l.qty} ✓ +` : "+"}));
}
function renderSearch() {
  const cats = [...new Set(CATL.map((i) => i.cat))].sort((a, b) => a.localeCompare(b));
  const chips = $("#cats");
  if (chips.childElementCount !== cats.length + 1) {
    chips.replaceChildren(...["", ...cats].map((c) => el("button", {"data-c": c, onclick: () => { UI.cat = UI.cat === c ? "" : c; render(); }, text: c || "Alles"})));
  }
  for (const b of chips.children) b.classList.toggle("on", b.dataset.c === UI.cat);
  const box = $("#results"); box.replaceChildren();
  const terms = norm(UI.q).split(/\s+/).filter(Boolean);
  let hits = CATL.filter((i) => (!UI.cat || i.cat === UI.cat) && terms.every((t) => norm(i.name + " " + i.cat).includes(t)));
  hits.sort((a, b) => (ST.counts[b.key] || 0) - (ST.counts[a.key] || 0) || a.name.localeCompare(b.name));
  if (!terms.length && !UI.cat) {
    const fav = hits.filter((i) => ST.counts[i.key]).slice(0, 12);
    if (fav.length) { box.append(el("h2", {class: "grp", text: "Vaak gekocht"})); box.append(el("div", {class: "card"}, fav.map(resultRow))); }
    box.append(el("h2", {class: "grp", text: `Alle producten (${hits.length})`}));
  }
  if (hits.length) box.append(el("div", {class: "card"}, hits.slice(0, 150).map(resultRow)));
  if (terms.length) {
    const name = UI.q.trim();
    box.append(el("div", {class: "card pad"},
      hits.length ? null : el("p", {class: "muted", style: "margin:0 0 8px", text: "Niet gevonden in de productlijst."}),
      el("button", {class: "btn primary", onclick: () => { addItem(slug(name), 1, name); }, text: `+ "${name}" toevoegen als eigen item`})));
  }
}

function renderPrices() {
  const box = $("#priceBody"); box.replaceChildren();
  if (!CHGL.length) return;
  const mine = (c) => lineOf(c.key) || ST.counts[c.key];
  const list = CHGL.slice().sort((a, b) => !!mine(b) - !!mine(a) || b.date.localeCompare(a.date));
  const row = (c) => {
    const it = CAT[c.key] || {key: c.key, name: c.name}, down = c.to < c.from, u = c.perKg ? "/kg" : "";
    return el("div", {class: "row"},
      el("div", {class: "main"},
        el("div", {class: "name"}, it.name, el("span", {class: "chg " + (down ? "down" : "up"), text: (down ? "goedkoper" : "duurder")})),
        el("div", {class: "meta", text: `${eur.format(c.from)}${u} → ${eur.format(c.to)}${u} · ${fmtDay(c.date)}` + (promoFor(c.key) && down ? " · promo" : "")})),
      CAT[c.key] ? el("button", {class: "add" + (lineOf(c.key) ? " in" : ""), onclick: () => addItem(c.key, 1, it.name), text: lineOf(c.key) ? `${lineOf(c.key).qty} ✓ +` : "+"}) : null);
  };
  const down = list.filter((c) => c.to < c.from), up = list.filter((c) => c.to > c.from);
  box.append(el("h2", {class: "grp", text: `Prijswijzigingen (30 dagen)`}));
  if (down.length) box.append(el("div", {class: "card"}, down.slice(0, 12).map(row)));
  if (up.length) box.append(el("div", {class: "card"}, up.slice(0, 12).map(row)));
  box.append(el("p", {class: "small muted", style: "margin:0 4px 8px"}, "Op basis van je kastickets en ", ppLink(), "."));
}

function renderPromos() {
  renderPrices();
  const box = $("#promoBody"); box.replaceChildren();
  const terms = norm(UI.pq).split(/\s+/).filter(Boolean);
  let items = PROMOL.map((k) => CAT[k]).filter((it) => it && promoFor(it.key) && terms.every((t) => norm(it.name).includes(t)));
  if (!items.length) {
    box.append(el("div", {class: "card pad empty"},
      el("p", {text: terms.length ? "Geen promoties gevonden." : "Er zijn op dit moment geen promoties bekend."}),
      META.promosAt ? el("p", {class: "small", text: `Laatst bijgewerkt ${fmtDay(META.promosAt)}.`}) : null));
    return;
  }
  const mine = (it) => !!(lineOf(it.key) || ST.counts[it.key] || (PROMOS[it.key] && PROMOS[it.key].matched));
  const pct = (it) => (bestDeal(it) || {}).pct || 0;
  items.sort((a, b) => mine(b) - mine(a) || pct(b) - pct(a) || a.name.localeCompare(b.name));
  const yours = items.filter(mine), rest = items.filter((i) => !mine(i));
  const promoRow = (it) => {
    const d = bestDeal(it), p = d.p, l = lineOf(it.key);
    return el("div", {class: "row"},
      thumb(it),
      el("div", {class: "main"},
        el("div", {class: "name"}, it.name, d.pct > 0 ? el("span", {class: "tag", text: `-${d.pct}%`}) : null),
        el("div", {class: "meta"}, `${dealText(p, it)}` + (d.save > 0.004 ? ` · ${eur.format(d.unit)}/st.` : "") + (p.until ? ` · t/m ${fmtDay(p.until)}` : ""),
          p.url ? [" · ", el("a", {href: p.url, target: "_blank", rel: "noopener", text: "PrijsProfeet"})] : null)),
      el("button", {class: "add" + (l ? " in" : ""), onclick: () => { if (l && l.qty < d.qty) setQty(it.key, d.qty); else addItem(it.key, l ? 1 : d.qty, it.name); }, text: l ? `${l.qty} ✓ +` : `+${d.qty}`}));
  };
  if (yours.length) { box.append(el("h2", {class: "grp", text: "Voor jou"})); box.append(el("div", {class: "card"}, yours.map(promoRow))); }
  box.append(el("h2", {class: "grp", text: `${yours.length ? "Andere promoties" : "Promoties"} (${rest.length})`}));
  box.append(el("div", {class: "card"}, rest.slice(0, UI.pmax).map(promoRow)));
  if (rest.length > UI.pmax) box.append(el("button", {class: "btn more", onclick: () => { UI.pmax += 60; render(); }, text: `Toon meer (${rest.length - UI.pmax})`}));
  if (META.promosAt) box.append(el("p", {class: "small muted", style: "margin:8px 4px", text: `Colruyt-folder via promotiez.be en PrijsProfeet, bijgewerkt ${fmtDay(META.promosAt)}.`}));
}

function renderRecipes() {
  const box = $("#recipeBody"); box.replaceChildren();
  for (const r of RECIPES) {
    const ings = r.ing.filter((g) => CAT[g.item]);
    const cost = ings.reduce((s, g) => s + (CAT[g.item].price || 0), 0);
    box.append(el("details", {class: "recipe", id: "r-" + r.id},
      el("summary", {}, el("span", {text: r.name}), el("span", {class: "muted small num", text: [r.min ? `${r.min} min` : "", r.pers ? `${r.pers} pers.` : ""].filter(Boolean).join(" · ")})),
      r.img ? el("img", {class: "rimg", src: r.img, alt: r.name, loading: "lazy"}) : null,
      r.img && r.imgCredit ? el("p", {class: "credit"}, "Foto: ", el("a", {href: r.imgPage || r.img, target: "_blank", rel: "noopener", text: `${r.imgCredit}${r.imgLicense ? ", " + r.imgLicense : ""}`})) : null,
      el("ul", {class: "ings"},
        ings.map((g) => el("li", {}, el("span", {text: CAT[g.item].name}), el("span", {class: "amt", text: g.amt || ""}))),
        (r.extra || []).map((x) => el("li", {}, el("span", {class: "muted", text: x}), el("span", {class: "amt", text: "zelf"})))),
      cost ? el("p", {class: "small muted", style: "margin:0 0 8px", text: `Verpakkingen samen ± ${eur.format(cost)}`}) : null,
      el("ol", {class: "steps"}, (r.steps || []).map((x) => el("li", {text: x}))),
      el("div", {class: "btns"},
        el("button", {class: "btn primary", onclick: () => cook(r), text: "👩‍🍳 Kookmodus"}),
        el("button", {class: "btn", onclick: () => {
          for (const g of ings) if (!lineOf(g.item)) ST.list.push({key: g.item, qty: 1, done: false});
          save(); toast(`Ingrediënten voor ${r.name} op je lijst`);
        }, text: "Ingrediënten op lijst"}))));
  }
  if (!RECIPES.length) box.append(el("p", {class: "empty", text: "Geen gerechten."}));
}

/* ---------- cooking mode: one step at a time, screen stays on ---------- */
const COOK = {r: null, i: 0, lock: null};
function cook(r) {
  COOK.r = r; COOK.i = 0; $("#cook").classList.add("on"); cookShow();
  if (navigator.wakeLock) navigator.wakeLock.request("screen").then((l) => { COOK.lock = l; }).catch(() => {});
}
function cookShow() {
  const r = COOK.r, n = r.steps.length, i = COOK.i;
  $("#cookTitle").textContent = r.name;
  $("#cookN").textContent = `Stap ${i + 1} van ${n}`;
  $("#cookTxt").textContent = r.steps[i];
  $("#cookBar").style.width = `${(i + 1) / n * 100}%`;
  $("#cookPrev").disabled = i === 0;
  $("#cookNext").textContent = i === n - 1 ? "Klaar ✓" : "Volgende →";
}
function cookClose() { $("#cook").classList.remove("on"); if (COOK.lock) COOK.lock.release().catch(() => {}); COOK.lock = null; }
$("#cookClose").addEventListener("click", cookClose);
$("#cookPrev").addEventListener("click", () => { if (COOK.i > 0) { COOK.i--; cookShow(); } });
$("#cookNext").addEventListener("click", () => { if (COOK.i < COOK.r.steps.length - 1) { COOK.i++; cookShow(); } else { cookClose(); toast("Smakelijk! 🍽️"); } });

/* ---------- nav ---------- */
function go(v) {
  UI.view = v;
  for (const b of document.querySelectorAll("nav.tabbar button")) b.classList.toggle("on", b.dataset.v === v);
  for (const s of document.querySelectorAll("section.view")) s.classList.toggle("on", s.id === "v-" + v);
  $("#title").textContent = TITLES[v];
  history.replaceState(null, "", "#" + v);
  render(); window.scrollTo(0, 0);
  if (v === "zoeken") setTimeout(() => $("#q").focus(), 50);
}
for (const b of document.querySelectorAll("nav.tabbar button")) b.addEventListener("click", () => go(b.dataset.v));
$("#q").addEventListener("input", (e) => { UI.q = e.target.value; render(); });
$("#pq").addEventListener("input", (e) => { UI.pq = e.target.value; UI.pmax = 40; render(); });

/* ---------- boot ---------- */
(async () => {
  try { const raw = localStorage.getItem(KEY); if (raw) ST = Object.assign(ST, JSON.parse(raw)); } catch {}
  const get = (f) => fetch(`data/${f}.json`, {cache: "no-cache"}).then((r) => r.ok ? r.json() : {}).catch(() => ({}));
  const [cat, rec, promo, prices] = await Promise.all([get("catalog"), get("recipes"), get("promos"), get("prices")]);
  CATL = (cat.items || []).map((i) => ({...i, cat: i.cat || "Overige"}));
  const have = new Set(CATL.map((i) => i.key));
  PROMOS = {};
  for (const p of promo.promos || []) {
    if (!p.key) continue;
    if (!have.has(p.key)) { CATL.push({key: p.key, name: p.name, cat: "Promoties", price: p.regular || 0}); have.add(p.key); }
  }
  CAT = Object.fromEntries(CATL.map((i) => [i.key, i]));
  const saveOf = (it) => (bestDeal(it) || {}).save || 0;
  for (const p of promo.promos || []) {   // several promos for one product: keep the best
    if (!p.key) continue;
    const prev = PROMOS[p.key], it = CAT[p.key];
    PROMOS[p.key] = p;
    if (prev) { const now = saveOf(it); PROMOS[p.key] = prev; if (now > saveOf(it)) PROMOS[p.key] = p; }
  }
  PROMOL = Object.keys(PROMOS);
  const since = new Date(Date.now() - 30 * 864e5).toISOString().slice(0, 10);
  CHG = {}; for (const c of (prices.changes || [])) if (c.date >= since) CHG[c.key] = c;  // latest per product
  CHGL = Object.values(CHG);
  RECIPES = rec.recipes || [];
  META.promosAt = promo.updatedAt;
  if (cat.pricedAt) $("#pricedAt").textContent = `Prijzen ${fmtDay(cat.pricedAt)}`;
  if (!CATL.length) toast("Productlijst kon niet geladen worden.");
  const h = location.hash.slice(1);
  go(TITLES[h] ? h : "lijst");
})();
if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(() => {});
})();
</script>
</body>
</html>
